name: Capture real portfolio screenshots
on:
  push:
    branches: [feature/global-ai-visibility]
    paths: ['scripts/capture-projects.mjs','.github/workflows/portfolio-capture.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m pip install --break-system-packages Pillow
      - run: node scripts/capture-projects.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-portfolio-captures
          path: site/assets/projects/
      - name: Save verified captures to development branch
        if: success() && github.ref == 'refs/heads/feature/global-ai-visibility'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/projects
          git diff --cached --quiet && exit 0
          git commit -m "Add verified project screenshots and provenance"
          git push origin HEAD:feature/global-ai-visibility
